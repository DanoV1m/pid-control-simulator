name: Control engine tests
on:
  pull_request:
  push:
    branches: ['upgrade/**']
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check installed dependencies
        run: |
          python --version
          python -m pip check
          python -m pip freeze
          python -c "import streamlit, numpy, scipy, pandas, plotly; print('All five direct dependencies imported successfully')"
      - name: Numerical regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile application and engine
        run: python -m py_compile app.py control_engine.py
      - name: Streamlit interface regression tests
        run: python -m unittest discover -s ui_tests -v
